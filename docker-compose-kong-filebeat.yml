# docker-compose-kong-filebeat.yml
volumes:
  kong_db_data: {}       # pour Postgres de Kong

networks:
  webnet: {}             # pour Filebeat (connexion à ELK)
  kong-net:              # réseau isolé pour Kong
    driver: bridge

services:
  # Filebeat
  filebeat:
    image: docker.elastic.co/beats/filebeat:9.1.2
    container_name: filebeat-gold
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro   # <── ajout du :ro
      - ./logs:/usr/share/filebeat/logs
    networks:
      - webnet
    depends_on:
      - elasticsearch

    # depends_on supprimé si Elasticsearch est lancé ailleurs

  # Postgres pour Kong CE
  kong-db:
    container_name: kong-db
    image: postgres:latest
    restart: on-failure
    volumes:
      - kong_db_data:/var/lib/postgresql/data
    networks:
      - kong-net
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kong
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 5s
      timeout: 10s
      retries: 10
    ports:
      - "5433:5432"

  # Kong CE
  kong:
    image: kong:3.3
    container_name: kong
    restart: on-failure
    networks:
      - kong-net
    depends_on:
      kong-db:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_DATABASE: kong
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"  # Proxy HTTP
      - "8001:8001"  # Admin API HTTP
