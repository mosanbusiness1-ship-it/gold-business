version: '3.8'

volumes:
  kong_db_data: {}
  # Pas besoin de filebeat_config si on monte le fichier directement

networks:
  webnet: {}
  kong-net:
    driver: bridge

services:
  # =======================
  # Base de données app
  # =======================
  postgres:
    image: postgres:latest
    container_name: gold-business-db
    environment:
      POSTGRES_DB: gold-business
      POSTGRES_USER: LENOVO
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    networks:
      - webnet

  # =======================
  # Elasticsearch
  # =======================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    container_name: elasticsearch-gold
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - webnet

  # =======================
  # Kibana
  # =======================
  kibana:
    image: docker.elastic.co/kibana/kibana:9.0.0
    container_name: kibana-gold
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - webnet


  
  
  
  