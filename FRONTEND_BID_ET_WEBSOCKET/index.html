<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Auction</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #111827;
        color: #f3f4f6;
        padding: 24px;
      }
      .card {
        max-width: 720px;
        margin: 0 auto;
        background: #1f2937;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      }
      .price {
        font-size: 2.5rem;
        margin: 20px 0;
        font-weight: bold;
        color: #fbbf24;
      }
      .meta {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin: 12px 0;
        color: #d1d5db;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 10px 16px;
        cursor: pointer;
        font-size: 1rem;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        margin: 12px 0 20px;
        border-radius: 8px;
        border: 1px solid #374151;
        background: #111827;
        color: white;
      }
      .status {
        color: #34d399;
      }
      .error {
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Enchère en direct</h1>

      <div class="meta">
        <span>Enchère ID: <strong id="auctionId">-</strong></span>
        <span class="status" id="status">Connecting...</span>
      </div>

      <div class="price" id="currentPrice">0 XAF</div>

      <div class="meta">
        <span>Meilleur enchérisseur: <strong id="winner">-</strong></span>
        <span>Nombre d’offres: <strong id="bidCount">0</strong></span>
      </div>

      <label for="amount">Nouvelle offre</label>
      <input id="amount" type="number" min="1" step="1" placeholder="15000" />

      <button id="placeBidBtn">Placer une enchère</button>
      <div id="message" class="status"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
